name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate system files
        run: flutter create --platforms=windows .
        
      - name: Install dependencies
        run: flutter pub get

      - name: Inject Secret Keys and Permanent Keystore
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p assets
          echo "$FIREBASE_SECRET" | base64 -d > assets/firebase_credentials.json

      - name: Build Windows App
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build windows --release --dart-define=GEMINI_API_KEY=$GEMINI_SECRET

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-windows-app
          path: build/windows/x64/runner/Release/
