name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms windows
          flutter pub get

      - name: Inject Secret Keys (Push Notifications)
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p assets
          echo "$FIREBASE_SECRET" | base64 -d > assets/firebase_credentials.json
        shell: bash

      - name: Fix CMake and Visual Studio strict errors
        run: |
          cat << 'EOF' > fix_cmake.dart
          import 'dart:io';
          void main() {
            var f = File('windows/CMakeLists.txt');
            if (f.existsSync()) {
              var text = f.readAsStringSync();
              // Убиваем ошибку CMake от Firebase и ошибку Coroutine от Visual Studio
              text = text.replaceFirst(
                'project(', 
                'set(CMAKE_POLICY_VERSION_MINIMUM "3.5")\nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\nproject('
              );
              f.writeAsStringSync(text);
            }
          }
          EOF
          dart fix_cmake.dart
        shell: bash

      - name: Build Windows App
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build windows --release --dart-define=GEMINI_API_KEY=$GEMINI_SECRET

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-windows-app
          path: build/windows/x64/runner/Release/
