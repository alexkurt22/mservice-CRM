name: mservice_crm
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # --- Core & UI ---
  cupertino_icons: ^1.0.8
  intl: ^0.18.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  
  # --- Firebase Services ---
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.9.4
  
  # --- Google API (Push Notifications & Monitoring) ---
  googleapis_auth: ^1.4.1
  googleapis: ^13.0.0
  http: ^1.2.0
  
  # --- Media, Files & Hardware ---
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  mobile_scanner: ^5.0.3
  permission_handler: ^11.3.1
  
  # --- Audio (Ringtones & Voice) ---
  flutter_ringtone_player: ^4.0.0+4
  just_audio: ^0.9.36
  flutter_sound: ^9.2.13
  
  # --- AI Services ---
  google_generative_ai: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firebase_credentials.json
